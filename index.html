<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3b86f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Nest Flow">
<title>Nest Flow</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css">
</head><body>
<main class="game">
<header><div class="logo"><b>NEST</b><strong>FLOW</strong><span>🐜</span></div><div class="level-pill">LEVEL <b id="levelNo">1</b></div><button id="sound" class="icon-btn" aria-label="Sound">♪</button></header>
<section class="board-wrap"><canvas id="board" aria-label="Block clearing board"></canvas><div class="hole"></div><div id="message" class="message" hidden><h1 id="messageTitle">Colony jammed!</h1><p id="messageText"></p><button id="messageBtn">Try again</button></div></section>
<section class="slots" id="slots" aria-label="Five colony slots"></section>
<section class="trays" id="trays" aria-label="Ant box stacks"></section>
<footer><button id="restart">↻ Restart</button><div><b id="leftCount">0</b> blocks left</div><button id="next">Next ›</button></footer>
</main><div id="toast" class="toast"></div><script src="app.js" defer></script>
</body></html>
